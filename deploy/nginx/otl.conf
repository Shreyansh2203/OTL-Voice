# nginx front for the OTL Timesheet Assistant (single origin).
#
# The FastAPI app serves BOTH the PWA and the /api routes, so nginx only needs
# to reverse-proxy everything to it. This keeps the browser on one origin —
# no CORS, and the session cookie is same-site.
#
# Default: plain HTTP on :80 (works out of the box). For production, enable the
# TLS server block at the bottom, put certs under deploy/nginx/certs/, and set
# SESSION_COOKIE_SECURE=true for the app.

upstream otl_app {
    server app:8000;   # docker-compose service name; use 127.0.0.1:8000 if host-run
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Server-Sent Events (chat streaming): never buffer, allow long-lived reads.
    location /api/chat {
        proxy_pass http://otl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else: the SPA (served by FastAPI) and the rest of /api.
    location / {
        proxy_pass http://otl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# PRODUCTION TLS (single origin over HTTPS). To enable:
#   1. Place fullchain.pem and privkey.pem in deploy/nginx/certs/
#      (Let's Encrypt, or self-signed for testing).
#   2. Expose 443 in docker-compose and mount the certs dir.
#   3. Set SESSION_COOKIE_SECURE=true for the app.
#   4. Remove/replace the plain :80 server above with the redirect below.
