name: otl-voice-dev

services:
  app:
    image: otl-voice:dev
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: "lax"
      DEV_MODE: "true"
      TEST_MODE: "false"
      CSP_DEV_MODE: "true"
      REDIS_REQUIRED: "false"
      IDEMPOTENCY_DB_PATH: /app/data/idempotency/idempotency.sqlite3
      READINESS_REQUIRE_OTL: "false"
    expose:
      - "8000"
    volumes:
      - ../data:/app/data
      - ../data/idempotency:/app/data/idempotency
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/deploy/readycheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/otl-dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
