# Single-origin deployment: FastAPI (serving the built PWA + /api) behind nginx.
#
#   cd deploy && docker compose up --build
#   open http://localhost         (nginx :80 -> app :8000)
#
# The app image is built from ../Containerfile (multi-stage: PWA build + backend).
# Secrets come from ../.env. For TLS, see deploy/nginx/otl.conf.

services:
  app:
    build:
      context: ..
      dockerfile: Containerfile
    env_file:
      - ../.env
    environment:
      # HTTP by default (nginx :80). Set to true once TLS is enabled, otherwise
      # a Secure cookie won't be sent over http and login will appear to fail.
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_SAMESITE=lax
      # CORS is unused in single-origin mode; keep empty to avoid confusion.
      - CORS_ORIGINS=
    expose:
      - "8000"          # internal only; nginx is the public entrypoint
    volumes:
      # Mount the local data directory (contains fusion catalogue + SQLite DB)
      - ../data:/app/data
      # Mount the OCI PEM key
      - ../ssrivastava@acsesolutions.com-2026-08-12T18_58_44.434Z.pem:/app/ssrivastava@acsesolutions.com-2026-08-12T18_58_44.434Z.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"     # enable with the TLS server block in otl.conf
    volumes:
      - ./nginx/otl.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # mount certs for TLS
    restart: unless-stopped
