fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: backend-mypy
        name: backend mypy
        entry: uv run --frozen mypy backend
        language: system
        pass_filenames: false
        files: ^(backend/.*\.py|pyproject\.toml)$
      - id: frontend-format
        name: frontend prettier (check)
        entry: pnpm --dir frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|json|css|md)$
      - id: frontend-lint
        name: frontend eslint
        entry: pnpm --dir frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: frontend-typecheck
        name: frontend TypeScript
        entry: pnpm --dir frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|json)$
