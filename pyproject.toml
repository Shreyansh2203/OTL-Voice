[project]
name = "timesheet-repo"
version = "0.1.0"
description = "Voice-enabled Oracle Time and Labor assistant powered by Oracle Cloud Infrastructure (OCI) generative AI and speech services."
authors = [
    { name = "Shreyansh Srivastava", email = "main.doga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "fastapi>=0.111",
    "httpx>=0.27",
    "oci>=2.186.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "uvicorn[standard]>=0.30",
    "websockets>=17.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "openpyxl>=3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", ".venv2", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",
    "B027",
    "B904",
    "B905",
    "BLE001",
    "E402",
    "S110",
    "SIM105",
    "SIM117",
    "SIM300",
    "TRY002",
    "UP015",
]

[tool.ruff.lint.per-file-ignores]
"backend/core/config.py" = ["I001"]
"deploy/preflight.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.12"
files = ["backend"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]
relative_files = true

[tool.coverage.report]
# Change this gate by editing fail_under; verify it with `uv run --frozen coverage report` (or `uv run --frozen coverage report --fail-under=<percent>`).
fail_under = 65
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
