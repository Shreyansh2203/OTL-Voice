[project]
name = "timesheet-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shreyansh Srivastava", email = "main.doga@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "oci>=2.140",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
timesheet-repo = "timesheet_repo:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openpyxl>=3.1",
]
