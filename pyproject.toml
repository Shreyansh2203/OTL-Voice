[project]
name = "timesheet-repo"
version = "0.1.0"
description = "Voice-enabled AI timesheet assistant for Oracle Time and Labor (OTL) powered by OCI GenAI and OCI Speech."
readme = "README.md"
authors = [
    { name = "Shreyansh Srivastava", email = "main.doga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "oci>=2.140",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110"]
