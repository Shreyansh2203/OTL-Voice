[project]
name = "timesheet-repo"
version = "0.1.0"
description = "Voice-enabled AI timesheet assistant for Oracle Time and Labor (OTL) powered by OCI GenAI and OCI Speech."
readme = "README.md"
authors = [
    { name = "Shreyansh Srivastava", email = "main.doga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "fastapi>=0.111",
    "httpx>=0.27",
    "oci>=2.140",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "websockets>=17.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "openpyxl>=3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.0",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "TRY002", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
norecursedirs = ["scripts", "backend/scripts", "frontend"]
addopts = "--ignore=backend/scripts --ignore=scripts"

[tool.mypy]
ignore_missing_imports = true
