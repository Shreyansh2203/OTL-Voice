name: Image Scan and Publish

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'requirements.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/image.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable version tag to publish (for example v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.image_tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  scan:
    name: Pre-publish scan (unpublished)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # load: true is safe here and only here: nothing is published from this
      # job, so the single-platform image can be handed to the local daemon.
      # The publish job below keeps push: true so Buildx can emit the SBOM and
      # provenance attestations that a loaded image cannot carry.
      - name: Build the candidate image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: otl-voice:pr-candidate
          cache-from: type=gha

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: otl-voice:pr-candidate
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Report the candidate digest
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanned the pull request candidate locally; nothing was pushed." \
            "The published artifact is still scanned in the publish job."

  publish:
    name: Build, scan, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject mutable image tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "image_tag must be a semantic version such as v1.2.3; ':latest' and other mutable tags are not published" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/otl-voice
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=${{ inputs.image_tag || github.ref_name }}

      - name: Build and publish image with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/otl-voice:${{ inputs.image_tag || github.ref_name }}
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Publish deployment metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-metadata-${{ github.run_id }}
          path: |
            .github/workflows/image.yml
          if-no-files-found: ignore
          retention-days: 30
