name: Image Scan and Publish

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/image.yml'
  release:
    types: [published]
  # A manually pushed v* tag builds the same immutable image. Note that a tag created
  # by release-please (which runs on the default GITHUB_TOKEN) does NOT trigger this:
  # events raised by GITHUB_TOKEN are suppressed by GitHub. Automating the
  # release-to-image path needs release-please to run with a PAT or GitHub App token
  # -- see README, "Release automation".
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable version tag to publish (for example v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.image_tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  scan:
    name: Pre-publish scan (unpublished)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # load: true is safe here and only here: nothing is published from this
      # job, so the single-platform image can be handed to the local daemon.
      # The publish job below keeps push: true so Buildx can emit the SBOM and
      # provenance attestations that a loaded image cannot carry.
      - name: Build the candidate image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: otl-voice:pr-candidate
          cache-from: type=gha

      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: otl-voice:pr-candidate
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Report the candidate digest
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanned the pull request candidate locally; nothing was pushed." \
            "The published artifact is still scanned in the publish job."

  publish:
    name: Build, scan, and publish
    # Releases and manual dispatches only. Without this the job also ran on every
    # image-touching pull request, where github.ref_name is "<pr>/merge" and the
    # semver guard below failed -- a permanent red check on every such PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject mutable image tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "image_tag must be a semantic version such as v1.2.3; ':latest' and other mutable tags are not published" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/otl-voice
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=${{ inputs.image_tag || github.ref_name }}

      - name: Build and publish image with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/otl-voice:${{ inputs.image_tag || github.ref_name }}
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Publish deployment metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metadata-${{ github.run_id }}
          path: |
            .github/workflows/image.yml
          if-no-files-found: ignore
          retention-days: 30
