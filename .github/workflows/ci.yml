name: Continuous Integration

# Best Practice: Cancel stale, redundant runs on PRs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Best Practice: Limit default permissions of the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python dependencies
      run: uv sync --all-groups

    - name: Run Ruff (Python Linting)
      run: uv run ruff check .

    - name: Run Mypy (Python Type Checking)
      run: uv run mypy backend

    - name: Run Backend Tests (Pytest)
      run: uv run pytest --cov=backend --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: coverage.xml
        retention-days: 7

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci --ignore-scripts

    - name: Run TypeScript Check
      working-directory: ./frontend
      run: npm run typecheck

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Run Frontend Unit Tests (Vitest)
      working-directory: ./frontend
      run: npm run test:unit

    - name: Build Frontend (Vite)
      working-directory: ./frontend
      run: npm run build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7
