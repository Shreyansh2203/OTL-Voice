name: Continuous Integration

# Best Practice: Cancel stale, redundant runs on PRs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Best Practice: Limit default permissions of the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python dependencies
      run: uv lock && uv sync --all-groups

    - name: Run Ruff (Python Linting)
      run: uv run ruff check .

    - name: Verify Ruff formatting
      run: uv run ruff format --check backend

    - name: Run Mypy (Python Type Checking)
      run: uv run mypy backend

    - name: Run Backend Tests (Pytest)
      run: uv run pytest --cov=backend --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: coverage.xml
        retention-days: 7

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: pnpm/action-setup@v4
      with:
        version: 12.6.0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: pnpm install

    - name: Run TypeScript Check
      working-directory: ./frontend
      run: pnpm run typecheck

    - name: Run ESLint
      working-directory: ./frontend
      run: pnpm run lint

    - name: Run Frontend Unit Tests (Vitest)
      working-directory: ./frontend
      run: pnpm run test:unit

    - name: Build Frontend (Vite)
      working-directory: ./frontend
      run: pnpm run build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

  container:
    name: Container Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Container Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: otl-voice-test:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test container health
      run: |
        set -e
        docker run -d --name otl-voice-smoke -p 8000:8000 -e TEST_MODE=true -e DEV_MODE=true -e SESSION_SECRET_KEY=ci-test-secret-key-32-characters-min -e SESSION_COOKIE_SECURE=false otl-voice-test:latest
        trap 'docker rm -f otl-voice-smoke >/dev/null 2>&1 || true' EXIT
        for attempt in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/api/health; then
            exit 0
          fi
          sleep 1
        done
        docker logs otl-voice-smoke
        exit 1

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python dependencies
      run: uv lock && uv sync --all-groups

    - name: Set up Node.js
      uses: pnpm/action-setup@v4
      with:
        version: 12.6.0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: pnpm install

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      working-directory: ./frontend
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps

    - name: Install Playwright Dependencies
      working-directory: ./frontend
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps

    - name: Start Backend and Run E2E Tests
      working-directory: ./frontend
      run: |
        set -euo pipefail
        cd ..
        touch .env
        export TEST_MODE=true
        uv run uvicorn backend.main:app &
        backend_pid=$!
        cleanup() {
          kill "$backend_pid" >/dev/null 2>&1 || true
          wait "$backend_pid" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        for attempt in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/api/health; then
            break
          fi
          if ! kill -0 "$backend_pid" 2>/dev/null; then
            exit 1
          fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:8000/api/health
        cd frontend
        timeout 5m pnpm exec playwright test --project=chromium

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 14



