name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  PNPM_VERSION: '12.6.0'
  BACKEND_COVERAGE_FAIL_UNDER: '65'
  FRONTEND_STATEMENTS_FAIL_UNDER: '75'
  FRONTEND_BRANCHES_FAIL_UNDER: '70'
  FRONTEND_FUNCTIONS_FAIL_UNDER: '75'
  FRONTEND_LINES_FAIL_UNDER: '75'

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Exercise deployment preflight without secret output
        env:
          SESSION_SECRET_KEY: ci-session-random-value-for-smoke-only-32chars
          OTL_BASE_URL: https://mock.example.invalid
          OTL_SERVICE_USERNAME: ci-smoke-user
          OTL_SERVICE_PASSWORD: ci-smoke-password
        run: python deploy/preflight.py --env-file /dev/null --mode ci

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check backend

      - name: Run mypy
        run: uv run mypy backend

      - name: Run backend tests with coverage gate
        run: >-
          uv run pytest --cov=backend --cov-report=term-missing
          --cov-report=xml --cov-fail-under=${BACKEND_COVERAGE_FAIL_UNDER}

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.xml
            .coverage
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm --filter otl-timesheet-pwa exec tsc -b tsconfig.app.json tsconfig.node.json

      - name: Typecheck unit and end-to-end tests
        run: pnpm --filter otl-timesheet-pwa exec tsc --noEmit --project tsconfig.tests.json

      - name: Run ESLint
        run: pnpm --filter otl-timesheet-pwa run lint

      - name: Run frontend unit tests with coverage gate
        run: >-
          pnpm --filter otl-timesheet-pwa exec vitest run --coverage
          --coverage.reporter=text --coverage.reporter=json
          --coverage.reporter=html
          --coverage.thresholds.statements=${FRONTEND_STATEMENTS_FAIL_UNDER}
          --coverage.thresholds.lines=${FRONTEND_LINES_FAIL_UNDER}
          --coverage.thresholds.functions=${FRONTEND_FUNCTIONS_FAIL_UNDER}
          --coverage.thresholds.branches=${FRONTEND_BRANCHES_FAIL_UNDER}

      - name: Build frontend
        run: |
          pnpm --filter otl-timesheet-pwa exec tsc -b tsconfig.app.json tsconfig.node.json
          pnpm --filter otl-timesheet-pwa exec vite build

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: |
            frontend/coverage/
            frontend/dist/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile syntax and build invariants
        run: docker build --check .

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: otl-voice:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name otl-voice-smoke \
            -p 8000:8000 \
            -e TEST_MODE=true \
            -e DEV_MODE=false \
            -e SESSION_SECRET_KEY=ci-only-session-secret-key-32-chars \
            -e SESSION_COOKIE_SECURE=true \
            -e IDEMPOTENCY_DB_PATH=/tmp/idempotency/idempotency.sqlite3 \
            otl-voice:ci-${{ github.sha }} > /tmp/otl-container-id
          trap 'docker logs otl-voice-smoke > otl-container.log 2>&1 || true; docker rm -f otl-voice-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo 'container smoke check passed'
              exit 0
            fi
            sleep 1
          done
          docker logs otl-voice-smoke
          exit 1

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs
          path: otl-container.log
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Run full Playwright matrix
        shell: bash
        run: |
          set -euo pipefail
          export TEST_MODE=true
          export DEV_MODE=false
          export SESSION_COOKIE_SECURE=false
          export ALLOW_IN_MEMORY_SESSIONS=true
          export CSP_DEV_MODE=true
          export SESSION_SECRET_KEY=ci-only-session-secret-key-32-chars
          export OTL_BASE_URL=https://mock.example.invalid
          export OTL_SERVICE_USERNAME=ci-user
          export OTL_SERVICE_PASSWORD=ci-password
          backend_pid=''
          frontend_pid=''
          cleanup() {
            if [ -n "$frontend_pid" ]; then kill "$frontend_pid" >/dev/null 2>&1 || true; fi
            if [ -n "$backend_pid" ]; then kill "$backend_pid" >/dev/null 2>&1 || true; fi
            wait "$frontend_pid" "$backend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/otl-backend.log 2>&1 &
          backend_pid=$!
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then cat /tmp/otl-backend.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          pnpm --filter otl-timesheet-pwa exec vite --host 127.0.0.1 > /tmp/otl-vite.log 2>&1 &
          frontend_pid=$!
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            if ! kill -0 "$frontend_pid" 2>/dev/null; then cat /tmp/otl-vite.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          timeout --foreground --kill-after=15s 12m pnpm --filter otl-timesheet-pwa exec playwright test --project=chromium --project=firefox --project=webkit --reporter=line

      - name: Upload Playwright reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-matrix-${{ matrix.browser || 'all' }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/otl-backend.log
            /tmp/otl-vite.log
          if-no-files-found: ignore
          retention-days: 14
