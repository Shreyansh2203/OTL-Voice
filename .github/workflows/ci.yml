name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Default interpreter for the jobs that do not pin their own. The backend job
  # tests the full supported range via its own matrix, because pyproject.toml
  # declares requires-python = ">=3.12".
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'
  PNPM_VERSION: '12.6.0'
  PNPM_AUDIT_LEVEL: 'high'

jobs:
  backend:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the line the image ships; 3.12 is the pyproject.toml
        # `requires-python = ">=3.12"` floor and must keep passing.
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups

      - name: Exercise deployment preflight without secret output
        env:
          SESSION_SECRET_KEY: ci-session-random-value-for-smoke-only-32chars
          OTL_BASE_URL: https://mock.example.invalid
          OTL_SERVICE_USERNAME: ci-smoke-user
          OTL_SERVICE_PASSWORD: ci-smoke-password
        run: python deploy/preflight.py --env-file /dev/null --mode ci

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Verify Ruff formatting
        # backend and deploy, matching `make format-check`: deploy/*.py is Python that
        # runs in the image, and it was ungated in CI while the Makefile checked it.
        run: uv run ruff format --check backend deploy

      - name: Run mypy
        run: uv run mypy backend

      - name: Run backend tests with coverage gate
        # No --cov-fail-under here on purpose: the gate is pyproject.toml's
        # [tool.coverage.report] fail_under, so local and CI enforce one number.
        run: >-
          uv run pytest --cov=backend --cov-report=term-missing
          --cov-report=xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: |
            coverage.xml
            .coverage
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Export the locked Python dependency set
        run: >-
          uv export --all-groups --no-emit-project --no-hashes
          --format requirements-txt -o "$RUNNER_TEMP/otl-requirements.txt"

      - name: Audit Python dependencies
        run: >-
          uv run pip-audit --strict --progress-spinner off
          --requirement "$RUNNER_TEMP/otl-requirements.txt"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=${{ env.PNPM_AUDIT_LEVEL }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review the pull request dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm --filter otl-timesheet-pwa exec tsc -b tsconfig.app.json tsconfig.node.json

      - name: Typecheck unit and end-to-end tests
        run: pnpm --filter otl-timesheet-pwa exec tsc --noEmit --project tsconfig.tests.json

      - name: Run ESLint
        run: pnpm --filter otl-timesheet-pwa run lint

      - name: Verify frontend formatting
        run: pnpm --filter otl-timesheet-pwa run format:check

      - name: Run frontend unit tests with coverage gate
        # The statements/branches/functions/lines thresholds live in
        # frontend/vite.config.ts. They are deliberately NOT overridden here:
        # a --coverage.thresholds.* flag wins over the config file, so adding one
        # would give CI a different bar from local `pnpm test:coverage`.
        run: >-
          pnpm --filter otl-timesheet-pwa exec vitest run --coverage
          --coverage.reporter=text --coverage.reporter=json
          --coverage.reporter=html

      - name: Build frontend
        run: |
          pnpm --filter otl-timesheet-pwa exec tsc -b tsconfig.app.json tsconfig.node.json
          pnpm --filter otl-timesheet-pwa exec vite build

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/coverage/
            frontend/dist/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check Dockerfile syntax and build invariants
        run: docker build --check .

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: otl-voice:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name otl-voice-smoke \
            -p 8000:8000 \
            -e TEST_MODE=true \
            -e DEV_MODE=false \
            -e SESSION_SECRET_KEY=ci-only-session-secret-key-32-chars \
            -e SESSION_COOKIE_SECURE=true \
            -e IDEMPOTENCY_DB_PATH=/tmp/idempotency/idempotency.sqlite3 \
            otl-voice:ci-${{ github.sha }} > /tmp/otl-container-id
          trap 'docker logs otl-voice-smoke > otl-container.log 2>&1 || true; docker rm -f otl-voice-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              echo 'container smoke check passed'
              exit 0
            fi
            sleep 1
          done
          docker logs otl-voice-smoke
          exit 1

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-logs
          path: otl-container.log
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Run full Playwright matrix
        shell: bash
        run: |
          set -euo pipefail
          export TEST_MODE=true
          export DEV_MODE=false
          export SESSION_COOKIE_SECURE=false
          export ALLOW_IN_MEMORY_SESSIONS=true
          export CSP_DEV_MODE=true
          export SESSION_SECRET_KEY=ci-only-session-secret-key-32-chars
          export OTL_BASE_URL=https://mock.example.invalid
          export OTL_SERVICE_USERNAME=ci-user
          export OTL_SERVICE_PASSWORD=ci-password
          backend_pid=''
          frontend_pid=''
          cleanup() {
            if [ -n "$frontend_pid" ]; then kill "$frontend_pid" >/dev/null 2>&1 || true; fi
            if [ -n "$backend_pid" ]; then kill "$backend_pid" >/dev/null 2>&1 || true; fi
            wait "$frontend_pid" "$backend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          uv run uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/otl-backend.log 2>&1 &
          backend_pid=$!
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then cat /tmp/otl-backend.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          pnpm --filter otl-timesheet-pwa exec vite --host 127.0.0.1 > /tmp/otl-vite.log 2>&1 &
          frontend_pid=$!
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            if ! kill -0 "$frontend_pid" 2>/dev/null; then cat /tmp/otl-vite.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          set +e
          timeout --foreground --kill-after=15s 12m pnpm --filter otl-timesheet-pwa exec playwright test --project=chromium --project=firefox --project=webkit --reporter=line,github 2>&1 | tee /tmp/otl-playwright.log
          playwright_status=${PIPESTATUS[0]}
          set -e
          if [ "$playwright_status" -ne 0 ]; then
            echo "::error title=Playwright matrix failed::playwright test exited ${playwright_status}; see /tmp/otl-playwright.log in the playwright-matrix-all artifact"
            tail -n 120 /tmp/otl-playwright.log
          fi
          exit "$playwright_status"

      - name: Upload Playwright reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-matrix-${{ matrix.browser || 'all' }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/otl-backend.log
            /tmp/otl-vite.log
            /tmp/otl-playwright.log
          if-no-files-found: ignore
          retention-days: 14
