name: Deploy OTL-Voice

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Versioned GHCR image reference, preferably a sha256 digest'
        required: true
        type: string
      inventory:
        description: 'Optional Ansible inventory content; otherwise ANSIBLE_INVENTORY is used'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: otl-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Run the tracked Ansible deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMAGE_REF: ${{ inputs.image_ref }}
    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible-core==2.18.6

      - name: Validate deployment inputs without printing secrets
        shell: bash
        env:
          INVENTORY_CONTENT: ${{ inputs.inventory || secrets.ANSIBLE_INVENTORY }}
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_REF" =~ ^ghcr\.io/[^:@]+(:[^@]+)?(@sha256:[0-9a-f]{64})?$ ]] || [[ "$IMAGE_REF" == *latest* ]]; then
            echo 'image_ref must be a versioned or digest-pinned GHCR reference' >&2
            exit 1
          fi
          if [ -z "$INVENTORY_CONTENT" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo 'Ansible inventory and SSH key secrets are required' >&2
            exit 1
          fi
          printf '%s' "$INVENTORY_CONTENT" > "$RUNNER_TEMP/inventory.ini"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/id_ed25519"
          chmod 600 "$RUNNER_TEMP/id_ed25519"

      - name: Deploy pinned image with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'true'
        run: >-
          ansible-playbook deploy/ansible/playbook.yml
          -i "$RUNNER_TEMP/inventory.ini"
          --private-key "$RUNNER_TEMP/id_ed25519"
          -e "otl_image=$IMAGE_REF"
