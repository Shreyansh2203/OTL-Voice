name: Continuous Deployment

# Only trigger CD after CI completes on the main branch
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Ensure we only deploy if the CI pipeline actually passed (didn't fail)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK secret is not set in GitHub Settings."
            exit 1
          fi
          echo "Triggering deployment on Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
