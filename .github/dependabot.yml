version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      # The CodeQL action's v4 line fails at "Perform CodeQL Analysis" on this repo
      # while the pinned v3.38.2 passes, so Dependabot kept opening a red PR for a
      # major bump. Patch and minor bumps within v3 are still proposed automatically.
      # Revisit by trying v4 by hand and reading what the failing step says; this is
      # a deliberate hold, not an assumption that v4 is broken in general.
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
